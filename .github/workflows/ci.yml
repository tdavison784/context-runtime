name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # amd64 and arm64 runners: fixed-point determinism must hold on both (SDD section 10).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        go: ["1.26.x", "1.27.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: probe module vet and test
        # The nested module is outside the root module's ./... (SEC-1.7). Its
        # tests are offline; empty keys ensure nothing can reach a provider API.
        working-directory: probes/descriptor
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: go vet ./... && go test -race -count=1 ./...

  fuzz:
    # Bounded fuzzing of every fuzz target (Phase 3 gate item 14, TEST-1.3).
    # The checked-in testdata/fuzz corpora are also replayed as seeds by the
    # plain `go test` above; this job mutates beyond them. A crasher fails
    # the job and is printed with its reproducer path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: fuzz
        run: |
          set -e
          for target in \
            "FuzzParse ./internal/directive" \
            "FuzzPolicyAgreement ./internal/directive" \
            "FuzzIngest ./internal/ingest" \
            "FuzzMatchClaim ./internal/obligation" \
            "FuzzTestsPassVerdict ./internal/obligation" \
            "FuzzKeyedWriteInputs ./internal/tools"; do
            set -- $target
            go test -run='^$' -fuzz="^$1\$" -fuzztime=30s "$2"
          done
